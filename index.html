<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PHÚC 43 - PROXY FF & SHIZUKU TURBO</title>
  <meta name="theme-color" content="#060A14">
  <style>
    :root {
      --bg-dark: #060A14;
      --card-bg: rgba(12, 20, 37, 0.94);
      --card-border: #1E2D4A;
      --accent-blue: #2563EB;
      --accent-cyan: #00F0FF;
      --accent-green: #10B981;
      --accent-red: #EF4444;
      --text-main: #F8FAFC;
      --text-sub: #94A3B8;
      --glow-cyan: 0 0 20px rgba(0, 240, 255, 0.35);
      --glow-blue: 0 6px 24px rgba(37, 99, 235, 0.45);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      min-height: 100%;
      background-color: var(--bg-dark);
      background-image: radial-gradient(circle at 50% 0%, #0d1e44 0%, #060a14 75%);
      color: var(--text-main);
      overflow-x: hidden;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 16px 12px 32px;
      min-height: 100vh;
    }
    .app-container {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin: 0 auto;
    }
    /* Top Header Bar */
    .header-bar {
      background: linear-gradient(135deg, rgba(20, 32, 56, 0.85), rgba(10, 16, 30, 0.95));
      border: 1px solid rgba(0, 240, 255, 0.28);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand-title {
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.6px;
      background: linear-gradient(90deg, #00F0FF 0%, #38BDF8 50%, #818CF8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 16px rgba(0, 240, 255, 0.3);
    }
    .brand-sub {
      font-size: 11px;
      color: var(--text-sub);
      font-weight: 600;
      margin-top: 2px;
    }
    .live-status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.45);
      padding: 5px 11px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      color: #34D399;
      flex-shrink: 0;
    }
    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #10B981;
      border-radius: 50%;
      box-shadow: 0 0 10px #10B981;
      animation: pulse 1.6s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.9); opacity: 0.8; }
      50% { transform: scale(1.35); opacity: 1; box-shadow: 0 0 14px #34D399; }
      100% { transform: scale(0.9); opacity: 0.8; }
    }

    /* The Main Card */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 18px 16px;
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55), inset 0 1px 0 rgba(255, 255, 255, 0.05);
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2.5px;
      background: linear-gradient(90deg, #2563EB, #00F0FF, #10B981);
    }
    .card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .card-title {
      font-size: 13px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: #94A3B8;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-title span {
      color: var(--accent-cyan);
    }

    /* Badges */
    .badges-row {
      display: flex;
      gap: 6px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .turbo-badge {
      background: #121F38;
      border: 1px solid #23395E;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 9px;
      border-radius: 8px;
      color: #7DD3FC;
    }
    .turbo-badge.green {
      background: rgba(16, 185, 129, 0.18);
      border-color: rgba(16, 185, 129, 0.45);
      color: #6EE7B7;
    }
    .turbo-badge.hot {
      background: rgba(239, 68, 68, 0.18);
      border-color: rgba(239, 68, 68, 0.45);
      color: #FCA5A5;
    }

    /* Textarea Input - Exact Placeholder Requested */
    .input-box {
      width: 100%;
      height: 84px;
      background: #080D1A;
      border: 1px solid #1E2D4A;
      border-radius: 12px;
      padding: 12px 14px;
      color: #38BDF8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.5;
      resize: none;
      outline: none;
      transition: all 0.25s ease;
      display: block;
    }
    .input-box::placeholder {
      color: #64748B;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      line-height: 1.45;
    }
    .input-box:focus {
      border-color: var(--accent-cyan);
      box-shadow: 0 0 16px rgba(0, 240, 255, 0.25);
    }
    #server_address {
      height: 48px;
      margin-top: 6px;
      resize: vertical;
    }

    /* Button "CHẠY PROXY" */
    .btn-run {
      width: 100%;
      margin-top: 14px;
      background: linear-gradient(135deg, #0284C7 0%, #2563EB 55%, #4F46E5 100%);
      border: 1px solid #38BDF8;
      border-radius: 14px;
      padding: 15px 12px;
      font-size: 15px;
      font-weight: 800;
      color: #FFFFFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: var(--glow-blue);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.8px;
    }
    .btn-run:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 240, 255, 0.45);
    }
    .btn-run:active {
      transform: scale(0.98);
    }

    /* Button "TẢI FILE CÀI ĐẶT APP (.APK)" */
    .btn-install {
      width: 100%;
      margin-top: 10px;
      background: linear-gradient(135deg, #059669 0%, #10B981 100%);
      border: 1px solid #34D399;
      border-radius: 14px;
      padding: 14px 12px;
      font-size: 14px;
      font-weight: 800;
      color: #FFFFFF;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      letter-spacing: 0.5px;
      text-decoration: none;
    }
    .btn-install:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(52, 211, 153, 0.5);
    }
    .btn-install:active {
      transform: scale(0.98);
    }

    /* Backup download link */
    .btn-backup {
      width: 100%;
      margin-top: 8px;
      background: #142038;
      border: 1px solid #243B66;
      border-radius: 10px;
      padding: 10px;
      font-size: 12px;
      font-weight: 700;
      color: #93C5FD;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: all 0.2s;
    }
    .btn-backup:hover {
      background: #1E3A8A;
      color: #fff;
    }

    /* Percentage Progress Bar Section */
    .progress-section {
      display: none;
      margin-top: 14px;
      background: #080D1A;
      border: 1px solid #1E2D4A;
      border-radius: 12px;
      padding: 14px;
    }
    .progress-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .progress-percent {
      font-size: 24px;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      color: #00F0FF;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
    }
    .progress-stage {
      font-size: 11px;
      color: #94A3B8;
      font-weight: 600;
      margin-top: 2px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 9px;
      background: #141E34;
      border-radius: 6px;
      overflow: hidden;
      position: relative;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #2563EB, #00F0FF, #10B981);
      box-shadow: 0 0 14px #00F0FF;
      border-radius: 6px;
      transition: width 0.15s ease-out;
    }
    .log-box {
      margin-top: 10px;
      max-height: 110px;
      overflow-y: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: #38BDF8;
      line-height: 1.5;
      background: #050811;
      border-radius: 8px;
      padding: 8px 10px;
      border: 1px solid #142038;
    }
    .log-box::-webkit-scrollbar {
      width: 4px;
    }
    .log-box::-webkit-scrollbar-thumb {
      background: #23395E;
      border-radius: 4px;
    }

    .footer-note {
      text-align: center;
      font-size: 11px;
      color: #64748B;
      margin-top: 6px;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <div class="header-bar">
      <div>
        <div class="brand-title">⚡ PHÚC 43 - PROXY FF</div>
        <div class="brand-sub">Proxy thật • Trạng thái thiết bị thật</div>
      </div>
      <div class="live-status-pill">
        <div class="pulse-dot"></div>
        <span>SẴN SÀNG</span>
      </div>
    </div>

    <!-- KHỐI CHÍNH DUY NHẤT -->
    <div class="card">
      <div class="card-header">
        <div class="card-title"><span>🚀</span> PROXY CORE</div>
        <span id="device_status" style="font-size:10px; color:#F59E0B; font-weight:800;">ĐANG KIỂM TRA</span>
      </div>

      <div class="badges-row">
        <div class="turbo-badge green">Tình trạng: kiểm tra ADB</div>
        <div class="turbo-badge hot">Không hứa tăng FPS</div>
        <div class="turbo-badge">Không thay hệ thống giả lập</div>
      </div>

      <!-- Ô nạp code: Placeholder chuẩn theo yêu cầu -->
      <textarea id="proxy_code_input" class="input-box" placeholder="Để trống và bấm CHẠY PROXY để chạy Proxy VIP của Phúc"></textarea>

      <!-- Nút CHẠY PROXY -->
      <button id="btn_run_proxy" class="btn-run" onclick="startRunningProxy()">
        <span>🚀 CHẠY PROXY</span>
      </button>

      <label for="server_address" class="progress-stage">Địa chỉ máy chạy server (cùng Wi-Fi):</label>
      <input id="server_address" class="input-box" type="url" autocomplete="url" value="http://192.168.123.22:8043" aria-label="Địa chỉ máy chủ proxy">

      <!-- Khối Hiệu Ứng Phần Trăm (%) Xuất Hiện Khi Chạy -->
      <div id="progress_section" class="progress-section">
        <div class="progress-top-row">
          <div>
            <div style="font-size:10px; color:#64748B; font-weight:700;">TIẾN TRÌNH XUYÊN VÀO CẤU HÌNH:</div>
            <div id="progress_stage_lbl" class="progress-stage">Đang chuẩn bị...</div>
          </div>
          <div id="progress_percent_lbl" class="progress-percent">0%</div>
        </div>
        <div class="progress-bar-bg">
          <div id="progress_bar_fill" class="progress-bar-fill"></div>
        </div>
        <div id="log_box" class="log-box"></div>
      </div>
    </div>

    <div class="footer-note">
      Bản quyền: <b>PHÚC 43 GAMING PROXY & SHIZUKU</b> © 2026 • Ready for Render
    </div>
  </div>

  <script>
    const serverAddress = document.getElementById("server_address");
    const savedServerAddress = localStorage.getItem("phuc43_server_address");
    if (savedServerAddress) serverAddress.value = savedServerAddress;
    else if (!["http:", "https:"].includes(window.location.protocol)) {
      serverAddress.value = "http://192.168.123.22:8043";
    } else {
      serverAddress.value = window.location.origin;
    }

    serverAddress.addEventListener("change", () => {
      localStorage.setItem("phuc43_server_address", serverAddress.value.trim().replace(/\/+$/, ""));
      refreshDeviceStatus();
    });

    function apiUrl(path) {
      const base = serverAddress.value.trim().replace(/\/+$/, "");
      if (!/^https?:\/\/[^/]+$/i.test(base)) {
        throw new Error("Địa chỉ máy chủ không hợp lệ. Ví dụ: http://192.168.1.10:8043");
      }
      return base + path;
    }

    async function refreshDeviceStatus() {
      const status = document.getElementById("device_status");
      try {
        const response = await fetch(apiUrl("/api/status"));
        const result = await response.json();
        if (result.connected) {
          status.textContent = "ADB ĐÃ KẾT NỐI";
          status.style.color = "#10B981";
        } else {
          status.textContent = "CHƯA CÓ THIẾT BỊ";
          status.style.color = "#F59E0B";
        }
      } catch (error) {
        status.textContent = "KHÔNG KIỂM TRA ĐƯỢC";
        status.style.color = "#EF4444";
      }
    }

    refreshDeviceStatus();

    async function startRunningProxy() {
      const btn = document.getElementById('btn_run_proxy');
      const codeVal = document.getElementById('proxy_code_input').value.trim();

      btn.disabled = true;
      btn.style.opacity = "0.75";
      btn.innerHTML = "<span>ĐANG KIỂM TRA THIẾT BỊ...</span>";

      let result;
      try {
        const response = await fetch(apiUrl('/api/run_proxy'), {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code: codeVal })
        });
        const contentType = response.headers.get("content-type") || "";
        if (!response.ok || !contentType.includes("application/json")) {
          const text = await response.text();
          throw new Error(text || ("Máy chủ trả HTTP " + response.status));
        }
        result = await response.json();
      } catch (error) {
        result = { success: false, msg: "Không gọi được máy chủ proxy: " + error.message };
      }

      btn.disabled = false;
      btn.style.opacity = "1";
      if (result.success) {
        btn.innerHTML = "<span>✅ ĐÃ KẾT NỐI THIẾT BỊ</span>";
        btn.style.background = "linear-gradient(135deg, #059669, #10B981)";
      } else {
        btn.innerHTML = "<span>🚀 CHẠY PROXY</span>";
        btn.style.background = "linear-gradient(135deg, #0284C7 0%, #2563EB 55%, #4F46E5 100%)";
      }
      alert(result.msg);
    }
  </script>
</body>
</html>
